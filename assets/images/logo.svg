<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" width="100%" height="100%">
  <defs>
    <linearGradient id="siteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="45%" stop-color="#D4A843" />
      <stop offset="100%" stop-color="#9A701E" />
    </linearGradient>
    <linearGradient id="pureWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
  </defs>

  <!-- Left Luxury Icon / Crest -->
  <g transform="translate(4, 8)">
    <!-- Diamond Outer -->
    <polygon points="24,0 48,24 24,48 0,24" fill="none" stroke="url(#siteGold)" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="24,7 41,24 24,41 7,24" fill="url(#siteGold)" opacity="0.15" />
    <!-- Inner Sparkle Cross -->
    <line x1="24" y1="11" x2="24" y2="37" stroke="url(#siteGold)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="11" y1="24" x2="37" y2="24" stroke="url(#siteGold)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="3.2" fill="#FFF" />
  </g>

  <!-- Main Wordmark Typography -->
  <g transform="translate(68, 0)">
    <!-- NEXORA -->
    <text x="0" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', 'Times New Roman', serif" font-size="30" font-weight="900" letter-spacing="2" fill="url(#pureWhite)">NEXORA</text>
    
    <!-- Accent Dot -->
    <circle cx="152" cy="34" r="3.5" fill="url(#siteGold)" />

    <!-- MALL -->
    <text x="164" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', 'Times New Roman', serif" font-size="30" font-weight="900" letter-spacing="2" fill="url(#siteGold)">MALL</text>

    <!-- Subtitle: LUXURY MARKETPLACE -->
    <text x="2" y="54" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="8.5" font-weight="800" letter-spacing="5.5" fill="url(#siteGold)" opacity="0.95">LUXURY MARKETPLACE</text>
  </g>
</svg>