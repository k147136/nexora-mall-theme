<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d078" />
      <stop offset="50%" stop-color="#d4a843" />
      <stop offset="100%" stop-color="#a67c1e" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Luxury Diamond Icon Mark -->
  <g transform="translate(10, 14)">
    <polygon points="26,0 52,26 26,52 0,26" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="26,8 44,26 26,44 8,26" fill="url(#goldGrad)" opacity="0.18" />
    <!-- Inner Sparkle -->
    <circle cx="26" cy="26" r="4" fill="url(#goldGrad)" />
    <path d="M 26 12 L 26 40 M 12 26 L 40 26" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <!-- "NEXORA" -->
  <text x="76" y="47" font-family="'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="900" letter-spacing="3" fill="url(#silverGrad)" filter="url(#glow)">NEXORA</text>
  
  <!-- Dot "." Accent -->
  <text x="246" y="47" font-family="'Cinzel', 'Playfair Display', serif" font-size="38" font-weight="900" fill="url(#goldGrad)">.</text>

  <!-- "MALL" -->
  <text x="260" y="47" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="900" letter-spacing="3" fill="url(#goldGrad)" filter="url(#glow)">MALL</text>

  <!-- Subtitle Tag: "LUXURY MARKETPLACE" -->
  <text x="78" y="66" font-family="'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" font-size="9.5" font-weight="700" letter-spacing="7" fill="url(#goldGrad)" opacity="0.95">LUXURY MARKETPLACE</text>
</svg>